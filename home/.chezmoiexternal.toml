# Vim plugins as native packages under ~/.vim/pack/mine/start.
# Archives rather than git-repo clones so no .git directories land on disk.
# exact = true prunes files that disappear upstream; refreshed weekly.

[".vim/pack/mine/start/dracula"]
    type = "archive"
    url = "https://github.com/dracula/vim/archive/refs/heads/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

