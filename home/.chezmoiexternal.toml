# Vim plugins as native packages under ~/.vim/pack/mine/start.
# Archives rather than git-repo clones so no .git directories land on disk.
# exact = true prunes files that disappear upstream.
# URLs are pinned to commit SHAs: content is immutable, so no
# refreshPeriod is needed. To update a plugin, resolve the new SHA with
# git ls-remote and change the URL here, then chezmoi apply -R ~/.vim.

[".vim/pack/mine/start/dracula"]
    type = "archive"
    url = "https://github.com/dracula/vim/archive/4f068752154e70ef8e03d6a70992033fff20a165.tar.gz"
    exact = true
    stripComponents = 1

